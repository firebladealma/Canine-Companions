<body>
  <header class="nav">
    <div class="container">
      <h1>
        <a href="/">
          <img src="https://dogwiseacademy-web.s3.us-east-1.amazonaws.com/logo.png" alt="Canine Companion" class="logo">

  <main class="container">
    <h2>Contact CanineCompanion.pet</h2>
    <form name="contact" method="POST" data-netlify="true" action="/form-success.html" netlify-honeypot="bot-field">
  <p class="hidden"><label>Don't fill this out: <input name="bot-field"></label></p>
  <input type="text" name="name" placeholder="Your Name" required />
  <input type="email" name="email" placeholder="Your Email" required />
  <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
  <button type="submit">Send Message</button>
</form>
  </main>
